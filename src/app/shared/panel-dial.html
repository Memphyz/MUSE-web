<svg
  viewBox="0 0 360 360"
  class="panel"
  [class.panel--over]="overLimit()"
  [class.panel--static]="!animated()"
  role="img"
  [attr.aria-label]="label()"
>
  <defs>
    <clipPath id="panel-glass">
      <circle cx="180" cy="180" r="180" />
    </clipPath>
    <clipPath id="panel-map">
      <rect x="0" y="0" width="360" height="204" />
    </clipPath>
    <filter id="panel-card-shadow" x="-10%" y="-40%" width="120%" height="160%">
      <feDropShadow dx="0" dy="-9" stdDeviation="9" flood-color="#000" flood-opacity="0.45" />
    </filter>
    <filter id="panel-pill-shadow" x="-20%" y="-40%" width="140%" height="200%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.45" />
    </filter>
    <!-- The firmware recolors the white chip glyphs to the chip's text color -->
    <filter id="panel-tint-warning">
      <feFlood flood-color="#fcd34d" />
      <feComposite in2="SourceAlpha" operator="in" />
    </filter>
    <radialGradient id="panel-vignette" cx="50%" cy="50%" r="50%">
      <stop offset="78%" stop-color="#000" stop-opacity="0" />
      <stop offset="100%" stop-color="#000" stop-opacity="0.4" />
    </radialGradient>
  </defs>

  <g clip-path="url(#panel-glass)">
    <rect width="360" height="360" class="panel__land" />

    <!-- Map: the app's colors, in perspective, with the route always pointing up -->
    <g clip-path="url(#panel-map)">
      <path [attr.d]="streets()" class="panel__street" />
      <path [attr.d]="avenues()" class="panel__avenue" />

      <path [attr.d]="route()" class="panel__route-casing" />
      @if (traffic(); as slow) {
        <path [attr.d]="slow" class="panel__traffic" />
      }
      <path [attr.d]="route()" class="panel__route" />

      @if (marker(); as m) {
        <g [attr.transform]="'translate(' + m.x + ' ' + m.y + ')'">
          @if (m.radar && overLimit()) {
            <circle r="23" class="panel__pulse" />
            <circle r="23" class="panel__pulse panel__pulse--late" />
          }
          <image [attr.href]="m.icon" x="-19.5" y="-19.5" width="39" height="39" />
        </g>
      }
    </g>

    <!-- Bottom card: speedometer, maneuver, distance, trip -->
    <rect
      x="0"
      y="204"
      width="360"
      height="156"
      class="panel__card"
      filter="url(#panel-card-shadow)"
    />

    <line x1="180" y1="184" x2="180" y2="202" class="panel__trail" />
    <image href="assets/icons/rider_puck.svg" x="159.5" y="159.5" width="41" height="41" />

    <!-- On top of the map: arrival pill and road-state chips -->
    <g filter="url(#panel-pill-shadow)">
      <rect x="132" y="9" width="96" height="31" rx="15.5" class="panel__card" />
    </g>
    <path
      d="M150 18.5a6 6 0 0 0-6 6c0 4.5 6 10 6 10s6-5.5 6-10a6 6 0 0 0-6-6Zm0 4a2 2 0 1 1 0 4 2 2 0 0 1 0-4Z"
      class="panel__pin"
    />
    <text x="192" y="31.5" class="panel__eta">{{ eta() }}</text>

    @for (chip of chips(); track chip.text) {
      <g [attr.transform]="'translate(' + (180 - chip.width / 2) + ' 45)'">
        <g class="panel__chip">
          <g filter="url(#panel-pill-shadow)">
            <rect
              x="1"
              y="1"
              [attr.width]="chip.width - 2"
              height="41"
              rx="20.5"
              class="panel__chip-box"
            />
          </g>
          <image
            [attr.href]="chip.icon"
            x="9"
            y="5"
            width="33"
            height="33"
            filter="url(#panel-tint-warning)"
          />
          <text x="47" y="28" class="panel__chip-text">{{ chip.text }}</text>
        </g>
      </g>
    }

    @for (dot of dots(); track $index) {
      <circle
        [attr.cx]="dot.x"
        [attr.cy]="dot.y"
        [attr.r]="dot.r"
        [class]="'panel__dot panel__dot--' + dot.state"
      />
    }
    <line
      [attr.x1]="limitTick.x1"
      [attr.y1]="limitTick.y1"
      [attr.x2]="limitTick.x2"
      [attr.y2]="limitTick.y2"
      class="panel__tick"
    />
    <g transform="translate(80 201)">
      <circle r="21.5" class="panel__plate" />
      <text y="7.5" class="panel__plate-text">{{ limit() }}</text>
    </g>
    <text x="80" y="260" class="panel__speed">{{ speed() }}</text>
    <text x="80" y="281" class="panel__unit">km/h</text>

    <rect x="143" y="227" width="54" height="54" rx="17" class="panel__maneuver-box" />
    <image [attr.href]="maneuverIcon()" x="150.5" y="234.5" width="39" height="39" />
    <!-- prettier-ignore -->
    <text x="204" y="268" class="panel__distance">{{ distanceLabel() }}<tspan dx="3" class="panel__distance-unit">m</tspan></text>

    <text x="113" y="319" class="panel__trip">{{ tripMinutes() }} min</text>
    <text x="248" y="319" class="panel__trip">{{ tripKm() }} km</text>

    <path [attr.d]="progressPath" class="panel__progress-track" />
    <path
      [attr.d]="progressPath"
      class="panel__progress"
      [attr.stroke-dasharray]="progressDash()"
    />

    <circle cx="180" cy="180" r="180" fill="url(#panel-vignette)" pointer-events="none" />
  </g>

  <circle cx="180" cy="180" r="178" class="panel__bezel" />
</svg>
